<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      background-color: #0b091a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      border: 4px solid #ff8906;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(255, 137, 6, 0.4);
      background: #12121a;
    }
  </style>
</head>
<body>
  <canvas id="gameWorld" width="700" height="350"></canvas>
  <script>
    const canvas = document.getElementById('gameWorld');
    const ctx = canvas.getContext('2d');

    const params = new URLSearchParams(window.location.search);
    const stage = parseInt(params.get('stage')) || 1;
    const playerHp = parseInt(params.get('php')) || 10;
    const bossHp = parseInt(params.get('bhp')) || 3;
    const maxBossHp = parseInt(params.get('max_bhp')) || 3;
    const actionState = params.get('result') || 'idle';

    const bossNames = ["1. Sát Thủ Áo Đen", "2. Phù Thủy Xương", "3. Nữ Hoàng Bóng Tối"];

    const playerImg = new Image(); playerImg.src = "nhân vật chính.jpg";
    const bossImgs = [new Image(), new Image(), new Image()];
    bossImgs[0].src = "boss 1.jpg";
    bossImgs[1].src = "boss 2.jpg";
    bossImgs[2].src = "boss 3.jpg";

    let pCols = 5, pRows = 4;
    let pFrameW = 0, pFrameH = 0;
    let animFrame = 0;

    Promise.all([
      new Promise(res => playerImg.onload = res),
      new Promise(res => bossImgs[0].onload = res),
      new Promise(res => bossImgs[1].onload = res),
      new Promise(res => bossImgs[2].onload = res)
    ]).then(() => {
      pFrameW = playerImg.width / pCols;
      pFrameH = playerImg.height / pRows;
      setInterval(renderWorld, 100);
    });

    function fnMapBackground() {
      if (stage === 1) {
        // Màn 1: Ngục tối / Hầm mộ u ám
        ctx.fillStyle = "#12121a"; ctx.fillRect(0, 0, 700, 350);
        ctx.fillStyle = "#1e1e2d"; 
        for(let i=50; i<700; i+=120) ctx.fillRect(i, 40, 45, 230);
        ctx.fillStyle = "#0a0a0f"; ctx.fillRect(0, 270, 700, 80);
      } else if (stage === 2) {
        // Màn 2: Đền thờ lửa / Hang động nham thạch
        let grad = ctx.createLinearGradient(0, 0, 0, 350);
        grad.addColorStop(0, "#2c0b0e"); grad.addColorStop(1, "#120304");
        ctx.fillStyle = grad; ctx.fillRect(0, 0, 700, 350);
        ctx.fillStyle = "#ff3800"; ctx.fillRect(0, 310, 700, 40);
        ctx.fillStyle = "#ffa200"; ctx.fillRect(0, 300, 700, 10);
        ctx.fillStyle = "#1a0505"; ctx.fillRect(0, 270, 700, 30);
      } else {
        // Màn 3: Lâu đài bầu trời / Ngai vàng Nữ Hoàng
        let grad = ctx.createLinearGradient(0, 0, 0, 350);
        grad.addColorStop(0, "#1f1035"); grad.addColorStop(1, "#43285c");
        ctx.fillStyle = grad; ctx.fillRect(0, 0, 700, 350);
        ctx.fillStyle = "#2d1647"; ctx.fillRect(100, 25, 35, 245); ctx.fillRect(560, 25, 35, 245);
        ctx.fillStyle = "#140a21"; ctx.fillRect(0, 270, 700, 80);
      }
      ctx.strokeStyle = "#ff8906"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, 270); ctx.lineTo(700, 270); ctx.stroke();
    }

    function renderWorld() {
      ctx.clearRect(0, 0, 700, 350);
      fnMapBackground();

      let pX = 120, pY = 175;
      let bX = 500, bY = 160;

      // Xử lý hiệu ứng kỹ năng chiến đấu 2D
      if (actionState === 'player_attack') {
        pX += 50;
        if (stage === 1) {
          ctx.fillStyle = "#00ffff"; ctx.beginPath(); ctx.arc(pX + 55, pY + 35, 22, 0, Math.PI*2); ctx.fill();
        } else if (stage === 2) {
          ctx.fillStyle = "#00b4d8"; ctx.beginPath(); ctx.arc(pX + 75, pY + 35, 15, 0, Math.PI*2); ctx.fill();
        } else if (stage === 3) {
          // Triệu hồi Boss 1 và Boss 2 lên đánh Nữ Hoàng
          if (bossImgs[0].complete) ctx.drawImage(bossImgs[0], 370, 175, 55, 95);
          if (bossImgs[1].complete) ctx.drawImage(bossImgs[1], 430, 170, 55, 95);
        }
      } else if (actionState === 'boss_attack') {
        if (stage === 1) {
          bX -= 35; // Boss 1 lao tới chém
        } else if (stage === 2) {
          ctx.fillStyle = "#ff4800"; ctx.beginPath(); ctx.arc(320, 195, 18, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = "#ffdd00"; ctx.beginPath(); ctx.arc(315, 195, 9, 0, Math.PI*2); ctx.fill();
        } else if (stage === 3) {
          ctx.strokeStyle = "#ffff00"; ctx.lineWidth = 5;
          ctx.beginPath(); ctx.moveTo(150, 0); ctx.lineTo(135, 115); ctx.lineTo(165, 185); ctx.lineTo(145, 270); ctx.stroke();
        }
      }

      // Vẽ nhân vật chính
      if (playerImg.complete && pFrameW > 0) {
        let pRow = 0;
        if (actionState === 'player_attack') pRow = 2;
        else if (actionState === 'boss_attack') pRow = 1;

        let srcX = (animFrame % pCols) * pFrameW;
        let srcY = pRow * pFrameH;
        ctx.drawImage(playerImg, srcX, srcY, pFrameW, pFrameH, pX, pY, 60, 95);
        animFrame++;
      }

      // Vẽ Boss hiện tại
      let currentBoss = bossImgs[stage - 1];
      if (currentBoss.complete) {
        ctx.drawImage(currentBoss, bX, bY, 75, 110);
      }

      // Giao diện Thanh Máu (Player 10 HP, Boss theo từng màn)
      ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(20, 15, 205, 32);
      ctx.strokeStyle = "#ff8906"; ctx.lineWidth = 2; ctx.strokeRect(20, 15, 205, 32);
      ctx.fillStyle = "#ff4d4d"; ctx.fillRect(25, 20, (playerHp / 10) * 195, 22);
      ctx.fillStyle = "#ffffff"; ctx.font = "bold 12px monospace";
      ctx.fillText(`Hiệp Sĩ: ${playerHp}/10 HP`, 35, 35);

      ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(475, 15, 205, 32);
      ctx.strokeStyle = "#e53170"; ctx.lineWidth = 2; ctx.strokeRect(475, 15, 205, 32);
      ctx.fillStyle = "#00ff88"; ctx.fillRect(480, 20, (bossHp / maxBossHp) * 195, 22);
      ctx.fillStyle = "#ffffff";
      ctx.fillText(`${bossNames[stage - 1]}: ${bossHp}/${maxBossHp}`, 490, 35);
    }
  </script>
</body>
</html>
